<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HiSSD 원본 로그 보기</title>
  <style>
    :root{color-scheme:light dark;--foreground:light-dark(#20242a,#e7e9ee);--background:light-dark(#fff,#17191d);--border:light-dark(#e2e5ea,#383d46);--viz-series-1:light-dark(#c73947,#ff8793);--viz-series-2:light-dark(#2563bd,#80b6ff);--green:light-dark(#178448,#62d894);--blue:light-dark(#2975cd,#87baff);--primary:light-dark(#242a34,#e4e8ee);--primary-foreground:light-dark(#fff,#17191d)}
    body{max-width:920px;margin:24px auto;padding:0 18px;background:var(--background);color:var(--foreground);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;}
    h2{font-size:20px;font-weight:500;margin-block:8px 16px}.viz-controls{display:flex;align-items:end;gap:9px;flex-wrap:wrap}.form-label{display:flex;flex-direction:column;gap:5px}.btn,.form-select{font:inherit;padding:7px 10px;border:1px solid var(--border);border-radius:5px;background:var(--background);color:var(--foreground)}.btn:disabled{opacity:.45}.btn-primary{background:var(--primary);color:var(--primary-foreground)}.form-range{width:100%;accent-color:var(--primary)}.table-responsive{overflow-x:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}.table th:first-child,.table td:first-child{text-align:left}.table th{font-weight:500}.text-small{font-size:12px}.tabular-nums{font-variant-numeric:tabular-nums}@media(max-width:420px){body{padding:0 10px}.viz-controls .form-label{width:100%}.btn{min-height:42px}}
  </style>
</head>
<body>
__FRAGMENT__
</body>
</html>
